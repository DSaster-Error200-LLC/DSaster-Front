name: WebApp PR Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/dsaster-front/**'
      - ".github/workflows/webapp-pr.yml"
      - ".github/actions/setup-webapp/**"
  # No paths filter: scripts/bump.sh needs a green run on every commit of main
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-front'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-webapp

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-front'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-webapp

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
