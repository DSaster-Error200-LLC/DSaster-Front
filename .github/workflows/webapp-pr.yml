name: WebApp PR Validation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/dsaster-front/**'
      - ".github/workflows/webapp-pr.yml"
      - ".github/actions/setup-webapp/**"
  # No paths filter: scripts/bump.sh needs a green run on every commit of main
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-front'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-webapp

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-front'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-webapp

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  generated-clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'src/dsaster-front'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-webapp

      - name: Verify generated Orval clients
        run: |
          cp api/search.ts "$RUNNER_TEMP/search.ts"
          cp api/booking.ts "$RUNNER_TEMP/booking.ts"
          pnpm api

          if ! diff -u --strip-trailing-cr "$RUNNER_TEMP/search.ts" api/search.ts; then
            echo "::error file=src/dsaster-front/api/search.ts::Generated Orval client is out of date. Regenerate and commit the updated file."
            exit 1
          fi

          if ! diff -u --strip-trailing-cr "$RUNNER_TEMP/booking.ts" api/booking.ts; then
            echo "::error file=src/dsaster-front/api/booking.ts::Generated Orval client is out of date. Regenerate and commit the updated file."
            exit 1
          fi
